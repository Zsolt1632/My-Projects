# application.yml

profiles:
  active: "jdbc"  # Possible values: in-memory or jdbc

in-memory:
  daoType: "inMemory"
  poolSize: 10

jdbc:
  daoType: "jdbc"
  jdbc:
    url: "jdbc:mysql://localhost:3306/hiking"
    driver: "com.mysql.cj.jdbc.Driver"
    username: "username"
    password: "password"
    poolSize: 10
